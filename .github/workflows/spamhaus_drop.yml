name: Update Spamhaus DROP lists (JSONL → TXT)
on:
  schedule:
    - cron: "17 * * * *"   # run hourly at :17 — do NOT run more often than hourly
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # IPv4 DROP
      - name: Fetch DROP v4 JSONL
        run: curl -fsSLo drop_v4.json https://www.spamhaus.org/drop/drop_v4.json
      - name: Convert v4 JSONL → TXT
        run: |
          jq -r 'select(.type == null) | .cidr' drop_v4.json \
          | sort -u > blocklists/spamhaus_drop_v4.txt

      # IPv6 DROP
      - name: Fetch DROP v6 JSONL
        run: curl -fsSLo drop_v6.json https://www.spamhaus.org/drop/drop_v6.json
      - name: Convert v6 JSONL → TXT
        run: |
          jq -r 'select(.type == null) | .cidr' drop_v6.json \
          | sort -u > blocklists/spamhaus_drop_v6.txt

      # Optional: combined file (v4 + v6) if you want just one URL on FGT
      - name: Build combined list
        run: |
          cat blocklists/spamhaus_drop_v4.txt blocklists/spamhaus_drop_v6.txt \
          | sort -u > blocklists/spamhaus_drop_all.txt

      - name: Commit changes
        run: |
          git config user.name "ti-bot"
          git config user.email "ti-bot@users.noreply.github.com"
          git add blocklists/spamhaus_drop_v4.txt blocklists/spamhaus_drop_v6.txt blocklists/spamhaus_drop_all.txt
          git commit -m "Update Spamhaus DROP v4/v6 (hourly)" || echo "No changes"
          git push
