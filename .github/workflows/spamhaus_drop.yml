name: Update Spamhaus DROP/EDROP
on:
  schedule:
    - cron: "11 * * * *"   # hourly; tune as needed
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch & convert v4 DROP
        run: |
          curl -fsSL https://www.spamhaus.org/drop/drop_v4.json \
          | jq -r '.drop[]?.cidr' > blocklists/spamhaus_drop_v4.txt
      - name: Fetch & convert v6 EDROP
        run: |
          curl -fsSL https://www.spamhaus.org/drop/drop_v6.json \
          | jq -r '.edrop[]?.cidr' > blocklists/spamhaus_drop_v6.txt
      - name: Dedup & sort
        run: |
          sort -u blocklists/spamhaus_drop_v4.txt -o blocklists/spamhaus_drop_v4.txt
          sort -u blocklists/spamhaus_drop_v6.txt -o blocklists/spamhaus_drop_v6.txt
      - name: Commit changes
        run: |
          git config user.name "ti-bot"
          git config user.email "ti-bot@users.noreply.github.com"
          git add blocklists/spamhaus_*drop_*.txt
          git commit -m "Update Spamhaus DROP/EDROP" || echo "No changes"
          git push
